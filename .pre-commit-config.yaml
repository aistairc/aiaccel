default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        language: system
        args: [--config-file, mypy.ini, --explicit-package-bases]
  - repo: https://github.com/LilSpazJoekp/docstrfmt
    rev: v2.0.0
    hooks:
      - id: docstrfmt
        args: [--check, docs/source/, --extend-exclude, docs/source/api_reference/generated]
        types_or: [rst]
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        args: [-formatter, retain_line_breaks=true, eof_newline=true]
  - repo: local
    hooks:
      - id: insert-license-current-year
        name: Insert license header using current year
        entry: python .github/scripts/insert_license_current_year.py
        language: python
        additional_dependencies:
          - git+https://github.com/Lucas-C/pre-commit-hooks@v1.5.5
        types_or: [python, makefile]

  - repo: local
    hooks:
      - id: pixi-lock-check
        name: Ensure pixi.lock is up to date
        entry: pixi
        args: [lock, --check, --manifest-path, pixi.toml]
        stages: [pre-push]
        language: system
        files: ^(pyproject|pixi)\.toml$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest -v -x -n auto --cov=aiaccel/ --cov-append --ignore=tests/job/apps tests/
        stages: [pre-push]
        language: system
        pass_filenames: false
        always_run: true
