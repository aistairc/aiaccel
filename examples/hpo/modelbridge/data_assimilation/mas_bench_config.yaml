micro_model: FL1-1
macro_model: FS1-1
# Each train scenario is one observation condition. Its micro and macro studies form one regression
# sample, paired by id. Real runs distinguish scenarios by micro_model/macro_model (per-scenario keys
# override the defaults above); mock runs distinguish them by mock_target.
train_scenarios:
  - {id: s0, mock_target: 0.1}
  - {id: s1, mock_target: 0.3}
  - {id: s2, mock_target: 0.5}
  - {id: s3, mock_target: 0.7}
  - {id: s4, mock_target: 0.9}
test_scenario: {id: t0, mock_target: 0.4}
agent_sizes:
  naive: 1
  rational: 0
  ruby: 0
trials:
  micro: 8
  macro_train: 8
  macro_test: 8
seeds:
  micro: 0
  macro_train: 100
  macro_test: 200
samplers:
  micro: tpe
  macro_train: tpe
  macro_test: tpe
scaling:
  sigma_scale: [97.0, 3.0]
  mu_scale: 300.0
  pi_complement: true
mas_bench_jar: ./work/tmp/MAS-Bench.jar
dataset_root: ../../../../work/tmp/masbench-resources/Dataset
# The bundled config runs without MAS-Bench assets. Set false for real simulations (see README.md).
allow_mock: true
output_root: ../../../../work/modelbridge/data_assimilation
