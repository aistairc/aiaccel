name: CI

on:
  push:
    branches: ["main", "develop/*"]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
        python-version: ["3.10"]
        test_target: ["config", "hpo", "torch"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions
      - name: Run pytest
        run: |
          pixi run -e gh-actions pytest -v \
            -n auto \
            --cov=aiaccel/${{ matrix.test_target }} \
            --cov-branch \
            --cov-append \
            --cov-report=term-missing \
            tests/${{ matrix.test_target }}
  ci-job-local:
    name: CI (${{ matrix.os }}, job/local)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions
      - name: Run pytest
        run: |
          pixi run -e gh-actions pytest -v \
            -n auto \
            --cov=aiaccel/job/apps \
            --cov-branch \
            --cov-append \
            --cov-report=term-missing \
            tests/job/apps/local.py
  ci-job-slurm:
    name: CI (ubuntu-22.04, job/slurm)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions

      - name: Install Slurm
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            munge \
            slurm-wlm

      - name: Configure Slurm
        run: |
          HOSTNAME="$(hostname -s)"
          NODE_CONFIG="$(slurmd -C | head -n 1)"

          sudo cp \
            tests/job/apps/fixtures/slurm/slurm.conf \
            /etc/slurm/slurm.conf

          sudo sed -i \
            -e "s/^SlurmctldHost=.*/SlurmctldHost=${HOSTNAME}/" \
            -e "s/^NodeName=.*/${NODE_CONFIG}/" \
            -e "s/Nodes=slurm/Nodes=${HOSTNAME}/" \
            /etc/slurm/slurm.conf

          sudo mkdir -p \
            /var/spool/slurmctld \
            /var/spool/slurmd \
            /var/log/slurm

          sudo chown slurm:slurm \
            /var/spool/slurmctld \
            /var/log/slurm

          sudo chown root:root \
            /var/spool/slurmd

          echo "=== /etc/slurm/slurm.conf ==="
          cat /etc/slurm/slurm.conf

      - name: Start Slurm
        run: |
          sudo systemctl restart munge
          sudo systemctl restart slurmctld
          sudo systemctl restart slurmd

      - name: Wait for Slurm
        run: |
          for i in $(seq 1 30); do
            if sinfo >/dev/null 2>&1; then
              sinfo
              exit 0
            fi

            sleep 1
          done

          sudo journalctl -u slurmctld
          sudo journalctl -u slurmd
          exit 1

      - name: Run Slurm tests
        run: |
          pixi run -e gh-actions pytest -v \
            tests/job/apps/slurm.py
  ci-job-pbs:
    name: CI (ubuntu-24.04, job/pbs)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions

      - name: Install OpenPBS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            m4 \
            autoconf \
            automake \
            libtool \
            libhwloc-dev \
            libx11-dev \
            libxt-dev \
            libedit-dev \
            libical-dev \
            libncurses-dev \
            libpq-dev \
            python3-dev \
            tcl-dev \
            tk-dev \
            swig \
            libexpat1-dev \
            libssl-dev \
            libxext-dev \
            libxft-dev \
            libcjson-dev \
            pkg-config \
            expat \
            postgresql \
            perl \
            sendmail-bin

      - name: Build OpenPBS
        run: |
          git clone --depth 1 \
            https://github.com/openpbs/openpbs.git \
            /tmp/openpbs

          cd /tmp/openpbs

          ./autogen.sh
          PYTHON=/usr/bin/python3 ./configure --prefix=/opt/pbs

          make -j"$(nproc)"
          sudo make install

          sudo /opt/pbs/libexec/pbs_postinstall

      - name: Configure PBS
        run: |
          HOSTNAME="$(hostname -s)"

          sudo sed -i \
            's/^PBS_START_MOM=.*/PBS_START_MOM=1/' \
            /etc/pbs.conf

          sudo chmod 4755 \
            /opt/pbs/sbin/pbs_iff \
            /opt/pbs/sbin/pbs_rcp

          echo "/opt/pbs/bin" >> "$GITHUB_PATH"
          echo "/opt/pbs/sbin" >> "$GITHUB_PATH"

      - name: Start PBS
        run: |
          sudo /opt/pbs/libexec/pbs_init.d start

      - name: Wait for PBS
        run: |
          for i in $(seq 1 30); do
            if /opt/pbs/bin/qstat -B >/dev/null 2>&1; then
              /opt/pbs/bin/qstat -B
              /opt/pbs/bin/pbsnodes -a
              exit 0
            fi

            sleep 1
          done

          sudo cat /var/spool/pbs/server_logs/* || true
          sudo cat /var/spool/pbs/mom_logs/* || true
          exit 1

      - name: Run PBS tests
        run: |
          pixi run -e gh-actions pytest -v \
            tests/job/apps/pbs.py
  ci-job-sge:
    name: CI (ubuntu-24.04, job/sge)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions

      - name: Install SGE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libdb5.3-dev \
            libhwloc-dev \
            libncurses-dev \
            libpam0g-dev \
            libssl-dev \
            libsystemd-dev \
            libtirpc-dev \
            libxext-dev \
            pkgconf

      - name: Build SGE
        run: |
          git clone --depth 1 \
            https://github.com/daimh/sge.git \
            /tmp/sge

          cd /tmp/sge

          cmake -S . -B build \
            -DCMAKE_INSTALL_PREFIX=/opt/sge

          cmake --build build -j"$(nproc)"

          sudo cmake --install build

      - name: Configure hostname
        run: |
          SGE_HOSTNAME="sge"
          IP_ADDRESS="$(hostname -I | awk '{print $1}')"

          sudo hostname "${SGE_HOSTNAME}"

          sudo sed -i \
            "/${IP_ADDRESS}/d" \
            /etc/hosts

          echo "${IP_ADDRESS} ${SGE_HOSTNAME}" \
            | sudo tee -a /etc/hosts

          echo "=== hostname ==="
          hostname
          hostname -s
          hostname -f

          echo "=== resolution ==="
          getent hosts "${SGE_HOSTNAME}"

          test "$(hostname -f)" = "${SGE_HOSTNAME}"

      - name: Configure SGE
        run: |
          sudo useradd -r -d /opt/sge sge || true
          sudo chown -R sge /opt/sge

          sudo tee /etc/default/sgemaster >/dev/null <<'EOF'
          SGE_QMASTER_PORT=6444
          SGE_EXECD_PORT=6445
          export SGE_QMASTER_PORT
          export SGE_EXECD_PORT
          EOF

          cd /opt/sge

          if ! sudo sh -c 'yes "" | ./install_qmaster'; then
            sudo systemctl stop sgemaster.service || true

            echo "=== qmaster foreground debug ==="

            sudo -u sge env \
              SGE_ROOT=/opt/sge \
              SGE_CELL=default \
              SGE_QMASTER_PORT=6444 \
              SGE_EXECD_PORT=6445 \
              SGE_ND=1 \
              SGE_COMMLIB_DEBUG=1 \
              timeout 40 \
              /opt/sge/bin/lx-amd64/sge_qmaster || true

            exit 1
          fi

          echo "=== qmaster started ==="
          sudo systemctl status sgemaster.service \
            --no-pager -l

          if ! sudo sh -c 'yes "" | ./install_execd'; then
            echo "=== sgeexecd status ==="
            sudo systemctl status sgeexecd.service \
              --no-pager -l || true

            echo "=== sgeexecd journal ==="
            sudo journalctl \
              -u sgeexecd.service \
              --no-pager \
              -n 200 || true

            echo "=== SGE messages ==="
            sudo find /opt/sge/default \
              -type f \
              -name messages \
              -exec sh -c '
                echo "===== $1 ====="
                cat "$1"
              ' _ {} \; || true

            exit 1
          fi

          export PATH="/opt/sge/bin/lx-amd64:${PATH}"
          source /opt/sge/default/common/settings.sh

          SUBMIT_HOST="$(hostname -f)"

          echo "Register submit host: ${SUBMIT_HOST}"

          sudo env \
            SGE_ROOT=/opt/sge \
            SGE_CELL=default \
            /opt/sge/bin/lx-amd64/qconf -as "${SUBMIT_HOST}"

          echo "=== submit hosts ==="
          sudo env \
            SGE_ROOT=/opt/sge \
            SGE_CELL=default \
            /opt/sge/bin/lx-amd64/qconf -ss

          echo "/opt/sge/bin/lx-amd64" >> "$GITHUB_PATH"
          echo "SGE_ROOT=/opt/sge" >> "$GITHUB_ENV"
          echo "SGE_CELL=default" >> "$GITHUB_ENV"

      - name: Check SGE
        run: |
          source /opt/sge/default/common/settings.sh

          echo "=== qhost ==="
          qhost

          echo "=== qhost -q ==="
          qhost -q

          echo "=== qstat ==="
          qstat -f

          echo "=== execution hosts ==="
          qconf -sel

          echo "=== submit hosts ==="
          qconf -ss

          echo "=== queues ==="
          qconf -sql

      - name: Verify SGE job execution
        run: |
          source /opt/sge/default/common/settings.sh

          echo 'echo hello > /tmp/sge-test.out' | qsub -cwd

          for i in $(seq 1 30); do
            if [ -f /tmp/sge-test.out ]; then
              cat /tmp/sge-test.out
              exit 0
            fi

            qstat || true
            sleep 1
          done

          echo "=== qstat ==="
          qstat -f || true

          echo "=== execd messages ==="
          sudo find /opt/sge/default/spool \
            -type f \
            -name messages \
            -print \
            -exec cat {} \; || true

          exit 1

      - name: Run SGE tests
        run: |
          source /opt/sge/default/common/settings.sh

          timeout 60 \
            pixi run -e gh-actions pytest -v \
              tests/job/apps/sge.py || {
                echo "=== qstat ==="
                qstat -f || true

                echo "=== test files ==="
                find /tmp/pytest-of-runner \
                  -maxdepth 5 \
                  -type f \
                  -print \
                  -exec sh -c '
                    echo "===== $1 ====="
                    cat "$1" || true
                  ' _ {} \; || true

                exit 1
              }
