name: CI

on:
  push:
    branches: ["main", "develop/*"]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
        python-version: ["3.10"]
        test_target: ["config", "hpo", "torch"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions
      - name: Run pytest
        run: |
          pixi run -e gh-actions pytest -v \
            -n auto \
            --cov=aiaccel/${{ matrix.test_target }} \
            --cov-branch \
            --cov-append \
            --cov-report=term-missing \
            tests/${{ matrix.test_target }}
  ci-job-local:
    name: CI (${{ matrix.os }}, job/local)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-22.04"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions
      - name: Run pytest
        run: |
          pixi run -e gh-actions pytest -v \
            -n auto \
            --cov=aiaccel/job/apps \
            --cov-branch \
            --cov-append \
            --cov-report=term-missing \
            tests/job/apps/local.py
  ci-job-slurm:
    name: CI (ubuntu-22.04, job/slurm)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions

      - name: Install Slurm
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            munge \
            slurm-wlm

      - name: Configure Slurm
        run: |
          HOSTNAME="$(hostname -s)"
          NODE_CONFIG="$(slurmd -C | head -n 1)"

          sudo cp \
            tests/job/apps/fixtures/slurm/slurm.conf \
            /etc/slurm/slurm.conf

          sudo sed -i \
            -e "s/^SlurmctldHost=.*/SlurmctldHost=${HOSTNAME}/" \
            -e "s/^NodeName=.*/${NODE_CONFIG}/" \
            -e "s/Nodes=slurm/Nodes=${HOSTNAME}/" \
            /etc/slurm/slurm.conf

          sudo mkdir -p \
            /var/spool/slurmctld \
            /var/spool/slurmd \
            /var/log/slurm

          sudo chown slurm:slurm \
            /var/spool/slurmctld \
            /var/log/slurm

          sudo chown root:root \
            /var/spool/slurmd

          echo "=== /etc/slurm/slurm.conf ==="
          cat /etc/slurm/slurm.conf

      - name: Start Slurm
        run: |
          sudo systemctl restart munge
          sudo systemctl restart slurmctld
          sudo systemctl restart slurmd

      - name: Wait for Slurm
        run: |
          for i in $(seq 1 30); do
            if sinfo >/dev/null 2>&1; then
              sinfo
              exit 0
            fi

            sleep 1
          done

          sudo journalctl -u slurmctld
          sudo journalctl -u slurmd
          exit 1

      - name: Run Slurm tests
        run: |
          pixi run -e gh-actions pytest -v \
            tests/job/apps/slurm.py
  ci-job-pbs:
    name: CI (ubuntu-24.04, job/pbs)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          environments: gh-actions

      - name: Install OpenPBS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            m4 \
            autoconf \
            automake \
            libtool \
            libhwloc-dev \
            libx11-dev \
            libxt-dev \
            libedit-dev \
            libical-dev \
            libncurses-dev \
            libpq-dev \
            python3-dev \
            tcl-dev \
            tk-dev \
            swig \
            libexpat1-dev \
            libssl-dev \
            libxext-dev \
            libxft-dev \
            libcjson-dev \
            pkg-config \
            expat \
            postgresql \
            perl \
            sendmail-bin

      - name: Build OpenPBS
        run: |
          git clone --depth 1 \
            https://github.com/openpbs/openpbs.git \
            /tmp/openpbs

          cd /tmp/openpbs

          ./autogen.sh
          PYTHON=/usr/bin/python3 ./configure --prefix=/opt/pbs

          make -j"$(nproc)"
          sudo make install

          sudo /opt/pbs/libexec/pbs_postinstall

      - name: Configure PBS
        run: |
          HOSTNAME="$(hostname -s)"

          sudo sed -i \
            's/^PBS_START_MOM=.*/PBS_START_MOM=1/' \
            /etc/pbs.conf

          sudo chmod 4755 \
            /opt/pbs/sbin/pbs_iff \
            /opt/pbs/sbin/pbs_rcp

          echo "/opt/pbs/bin" >> "$GITHUB_PATH"
          echo "/opt/pbs/sbin" >> "$GITHUB_PATH"

      - name: Start PBS
        run: |
          sudo /opt/pbs/libexec/pbs_init.d start

          HOSTNAME="$(hostname -s)"

          sudo /opt/pbs/bin/qmgr \
            -c "create node ${HOSTNAME}"

      - name: Wait for PBS
        run: |
          for i in $(seq 1 30); do
            if /opt/pbs/bin/qstat -B >/dev/null 2>&1; then
              /opt/pbs/bin/qstat -B
              /opt/pbs/bin/pbsnodes -a
              exit 0
            fi

            sleep 1
          done

          sudo cat /var/spool/pbs/server_logs/* || true
          sudo cat /var/spool/pbs/mom_logs/* || true
          exit 1

      - name: Run PBS tests
        run: |
          pixi run -e gh-actions pytest -v \
            tests/job/apps/pbs.py
