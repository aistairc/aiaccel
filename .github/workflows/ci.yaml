name: CI

on:
  push:
    branches: ["main", "develop/*"]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.10"]
        test_target: [config, hpo, torch]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.5
        with:
          manifest-path: pyproject.toml
          pixi-version: v0.66.0
          activate-environment: false
          environments: ci
      - name: Run pytest
        run: |
          pixi run -e ci pytest -v \
            -n auto \
            --cov=aiaccel/${{ matrix.test_target }} \
            --cov-branch \
            --cov-append \
            --cov-report=term-missing \
            tests/${{ matrix.test_target }}
